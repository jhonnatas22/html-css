<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadrasto.php" method="get" autocomplete="on">
        <p>
            <label for="iest">Estado</label>
            <select name="estado" id="iest">
                <option value="">---Selecione---</option>
                <optgroup label="Região Sudeste">
                    <option value="sp">São Paulo</option>
                    <option value="rj">Rio de Janeiro</option>
                    <option value="mg">Minas Gerais</option>
                    <option value="es">Espírito Santo</option>
                </optgroup>

                <optgroup label="Região Nordeste">
                    <option value="al">Alagoas</option>
                    <option value="se">Sergipe</option>
                    <option value="rn">Rio Grande do norte</option>
                </optgroup>
                </select>
        </p>
        <p>
            <label for="iprof">Profissão</label>
            <input type="text" name="prof" id="iprof" list="istprof">
            <datalist id="istprof">
                <option value="PROF">Professor</option>
                <option value="ENG">Engenheiro</option>
                <option value="MED">Médico</option>
                <option value="ADV">Advogado</option>
            </datalist>
        </p>
        <p>
            <label for="imsg">Mensagem</label><br>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
        </p>
          <p>
              <input type="submit" value="Enviar">
              <input type="reset" value="Limpar">
          </p>
    </form>
</body>
</html>
