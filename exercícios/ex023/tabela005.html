<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
            font-weight: bold;
           padding: 8px;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }

        .amarelo{
            background-color: #ffeb3b;
        }
        .verde{
            background-color: #8bc34a;
        }
    </style>
</head>
<body>
    <h1>Exercícios de Tabelas</h1>
    <table>
        <colgroup>
            <col class="amarelo">
            <col class="verde">
            <col class="amarelo">
            <col class="verde">
        </colgroup>
        <caption>Cadrasto</caption>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>
            <tr>
                <td>Bruno Silva</td>
                <td>M</td>
                <td>30</td>
                <td>Engenheiro</td>
            </tr>
            <tr>
                <td>Carla Souza</td>
                <td>F</td>
                <td>28</td>
                <td>Médica</td>
            </tr>
            <tr>
                <td>Daniel Oliveira</td>
                <td>M</td>
                <td>35</td>
                <td>Professor</td>
            </tr>
            <tr>
                <td>Elisa Ferreira</td>
                <td>F</td>
                <td>22</td>
                <td>Designer</td>
            </tr>
            <tr>
                <td>Felipe Costa</td>
                <td>M</td>
                <td>27</td>
                <td>Advogado</td>
            </tr>
       
    </table>
</body>
</html>
