<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Boletim Escolar</title>
    <style>
        table {
            width: 400px;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #444;
            color: white;
        }
        .titulo-area {
            background-color: #555;
            color: white;
            font-weight: bold;
            text-align: left;
        }
        .media-linha {
            background-color: #666;
            color: white;
            font-weight: bold;
            text-align: left;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Área</th>
        <th>Disciplinas</th>
        <th colspan="2">Notas</th>
        <th>Média</th>
    </tr>

    <!-- Título da área -->
    <tr>
        <td rowspan="4" class="titulo-area">Exatas</td>
        <td>Matemática</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
    </tr>
    <tr>
        <td>Física</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
    </tr>
    <tr>
        <td>Química</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
    </tr>
    <tr>
        <td>Biologia</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
    </tr>

    <!-- Média Exatas -->
    <tr>
        <td colspan="4" class="media-linha">Média de Exatas</td>
        <td>0.0</td>
    </tr>

    <!-- Humanas -->
    <tr>
        <td rowspan="2" class="titulo-area">Humanas</td>
        <td>História</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
    </tr>
    <tr>
        <td>Geografia</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
    </tr>

    <!-- Média Humanas -->
    <tr>
        <td colspan="4" class="media-linha">Média de Humanas</td>
        <td>0.0</td>
    </tr>
</table>

</body>
</html>
